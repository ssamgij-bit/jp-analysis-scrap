name: collect
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jpscrap
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: stock codes (first run)
        run: test -f codes.json || python codes.py
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: save state
        run: |
          git config user.name "jpscrap-bot"
          git config user.email "actions@github.com"
          git add state.json names_ko.json codes.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state update" -q
          git pull --rebase -q || true
          git push -q || true
