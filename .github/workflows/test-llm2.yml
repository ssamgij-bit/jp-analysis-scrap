name: test-llm2
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request
          urls = ['https://models.github.ai/inference/chat/completions', 'https://models.github.ai/inference/v1/chat/completions', 'https://models.inference.ai.azure.com/chat/completions', 'https://models.github.ai/orgs/ssamgij-bit/inference/chat/completions']
          for u in urls:
              model = 'gpt-4o-mini' if 'azure' in u else 'openai/gpt-4o-mini'
              body = {'model': model, 'messages': [{'role': 'user', 'content': 'Say hi in Korean'}], 'max_tokens': 30}
              req = urllib.request.Request(u, data=json.dumps(body).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  r = urllib.request.urlopen(req, timeout=60)
                  print(u, r.status, r.headers.get('content-type'), r.read()[:300])
              except Exception as e:
                  print(u, 'ERR', e, getattr(e, 'read', lambda: b'')()[:300])
          EOF
